# ═══════════════════════════════════════════════════════════════════
# destiny（看运）门 2 清单：全视图 AI 链路纯 UI 回归（生产）
# 2026-09-04 从 manifest.yaml 拆出：run-all 门 2 只跑纯 UI 路径，
# 混排 API 步骤的路径会被整条判 UI-UNCOVERED。
# 2026-09-23 扩容：解梦单路径 → 五场景分叉（问事聊天/解梦/奇门/中医/排盘AI）。
#   每条路径断言思考折叠条（think-trace）出现与收尾落定；问事路径带 {rand4}
#   内容级探针，专查「生成内容最终消失」。
# 铁律：全程只用导航点击切视图，禁止二次 goto（会丢内存中的盘面状态）。
# 账单：每条路径烧 1-2 次生产 LLM（问事路径里运势 auto 解读挂载即烧一次）。
# ═══════════════════════════════════════════════════════════════════
name: destiny-全视图AI链路UI回归
target:
  platform: web
  ui_base: https://destiny.solplum.com

environment:
  start: manual                      # 生产已在线，无需启动
  health:
    method: GET
    url: "https://destiny.solplum.com/api/health"
    expect: 200
    timeout_s: 60

variables:
  dream_text: "梦见深夜回到小学教室，桌椅都变得特别小，黑板上写满了我看不懂的公式，我想擦掉它们，越擦黑板越黑，最后一盏日光灯开始一闪一闪"
  tcm_question: "长期失眠多梦，凌晨一点醒就再睡不着，白天疲乏，手脚偏凉，一吃凉的就腹泻"
  qimen_goal: "下个月跳槽顺不顺"
  # rand4 每 run 一值：token_probe 供探测断言引用，与 chat_question 里嵌的码同源
  token_probe: "{rand4}"
  chat_name: "测试{rand4}"
  chat_question: "请在回答的第一行原样写出代码 {rand4}，然后用两三句话说说我事业上最近该注意什么。"

flow:
  steps:
    - id: ui_open_site
      # 晚高峰跨海直连实测 ~20KB/s，首屏资源全量 load 需 1-3 分钟，给足 300s
      ui: { action: goto, url: "{ui_base}", timeout_s: 300 }

    - id: scenario_dispatch
      fork:
        # exact 模式会校验各分支 pick 关键词须在题面文本中，故分发词必须含全部场景名
        read: "dream qimen tcm fortune ask"
        mode: exact
        branches:

          # ── 场景 1：解梦（无盘面依赖）────────────────────────────
          - id: dream_view
            pick: { contains: "dream" }
            then:
              - id: dream_nav
                ui: { action: click, target: ".primary-nav a[href='#dream']" }
              - id: dream_fill
                ui: { action: fill, target: "#dream textarea", value: "{dream_text}" }
              - id: dream_submit
                ui: { action: click, target: "#dream .dream-composer > button" }
              - id: dream_trace_visible    # 思考期折叠条必须出现（2026-09-23 新口径）
                ui: { action: expect_visible, target: ".dream-view .think-trace" }
              - id: dream_wait_generation
                ui: { action: wait, ms: 150000 }
              - id: dream_done_marker      # 「保存到本机」仅在 phase=done 渲染
                ui: { action: expect_visible, target: "text=保存到本机" }
              - id: dream_switch_away
                ui: { action: click, target: ".primary-nav a[href='#fortune']" }
              - id: dream_switch_back
                ui: { action: click, target: ".primary-nav a[href='#dream']" }
              - id: dream_result_persists
                ui: { action: expect_visible, target: ".dream-result" }

          # ── 场景 2：奇门（页内自足起局，无盘面依赖）────────────────
          - id: qimen_view
            pick: { contains: "qimen" }
            then:
              - id: qimen_nav
                ui: { action: click, target: ".primary-nav a[href='#qimen']" }
              - id: qimen_fill_goal
                ui: { action: fill, target: "#qimen textarea", value: "{qimen_goal}" }
              - id: qimen_cast
                ui: { action: click, target: ".qimen-cast" }
              - id: qimen_chart_card
                ui: { action: expect_visible, target: ".qimen-chart-card" }
              - id: qimen_interpret
                ui: { action: click, target: ".qimen-interpret-bar button" }
              - id: qimen_trace_visible
                ui: { action: expect_visible, target: ".qimen-thinking .think-trace" }
              - id: qimen_wait_generation
                ui: { action: wait, ms: 150000 }
              - id: qimen_done_marker
                ui: { action: expect_visible, target: "text=保存到本机" }
              - id: qimen_switch_away
                ui: { action: click, target: ".primary-nav a[href='#fortune']" }
              - id: qimen_switch_back
                ui: { action: click, target: ".primary-nav a[href='#qimen']" }
              - id: qimen_result_persists
                ui: { action: expect_visible, target: ".dream-result" }

          # ── 场景 3：中医问诊（无盘面依赖）────────────────────────
          - id: tcm_view
            pick: { contains: "tcm" }
            then:
              - id: tcm_nav
                ui: { action: click, target: ".primary-nav a[href='#tcm']" }
              - id: tcm_fill
                ui: { action: fill, target: "#tcm textarea", value: "{tcm_question}" }
              - id: tcm_submit
                ui: { action: click, target: "#tcm .dream-composer > button" }
              - id: tcm_trace_visible
                ui: { action: expect_visible, target: ".tcm-view .think-trace" }
              - id: tcm_wait_generation
                ui: { action: wait, ms: 150000 }
              - id: tcm_done_marker
                ui: { action: expect_visible, target: "text=保存到本机" }
              - id: tcm_switch_away
                ui: { action: click, target: ".primary-nav a[href='#fortune']" }
              - id: tcm_switch_back
                ui: { action: click, target: ".primary-nav a[href='#tcm']" }
              - id: tcm_result_persists
                ui: { action: expect_visible, target: ".dream-result" }

          # ── 场景 4：排盘 + 运势 AI 自动解读 ──────────────────────
          - id: fortune_ai
            pick: { contains: "fortune" }
            then:
              - id: fortune_nav_fortune   # 首访无 profile 默认落 chart 门，先进运势视图露出出生表单
                ui: { action: click, target: ".primary-nav a[href='#fortune']" }
              - id: fortune_fill_name
                ui: { action: fill, target: "input[name='displayName']", value: "{chat_name}" }
              - id: fortune_submit_chart
                ui: { action: click, target: ".submit-button" }
              - id: fortune_chart_ready
                ui: { action: expect_visible, target: ".today-results" }
              - id: fortune_trace_visible    # auto 解读挂载即进入思考
                ui: { action: expect_visible, target: ".today-view .think-trace" }
              - id: fortune_wait_generation
                ui: { action: wait, ms: 150000 }
              - id: fortune_done_marker      # 「本机缓存」小字仅在 phase=done 渲染
                ui: { action: expect_visible, target: "text=本机缓存" }
              - id: fortune_essay_present
                ui: { action: expect_visible, target: ".today-view .ai-answer" }

          # ── 场景 5：问事聊天 + 消失探针（核心怀疑路径）────────────
          - id: ask_chat
            pick: { contains: "ask" }
            then:
              - id: chat_nav_fortune      # 同上：首访先露出生表单
                ui: { action: click, target: ".primary-nav a[href='#fortune']" }
              - id: chat_fill_name
                ui: { action: fill, target: "input[name='displayName']", value: "{chat_name}" }
              - id: chat_submit_chart
                ui: { action: click, target: ".submit-button" }
              - id: chat_chart_ready
                ui: { action: expect_visible, target: ".today-results" }
              - id: chat_nav_ask
                ui: { action: click, target: ".primary-nav a[href='#ask']" }
              - id: chat_open_console
                ui: { action: click, target: ".domain-choices .is-chat" }
              - id: chat_input_ready
                ui: { action: expect_visible, target: ".chat-input textarea" }
              - id: chat_fill_question
                ui: { action: fill, target: ".chat-input textarea", value: "{chat_question}" }
              - id: chat_send
                ui: { action: click, target: ".chat-input button" }
              - id: chat_question_bubble
                ui: { action: expect_visible, target: ".chat-msg.is-user" }
              - id: chat_trace_visible
                ui: { action: expect_visible, target: ".ask-view .think-trace" }
              - id: chat_wait_generation
                ui: { action: wait, ms: 150000 }
              - id: chat_done_marker         # 落定后输入框重新可用
                ui: { action: expect_visible, target: ".chat-input textarea:not([disabled])" }
              - id: chat_answer_has_token    # 内容级断言：回答正文必须含随机码
                ui: { action: text_contains, value: "{token_probe}" }
              - id: chat_switch_away
                ui: { action: click, target: ".primary-nav a[href='#dream']" }
              - id: chat_switch_back
                ui: { action: click, target: ".primary-nav a[href='#ask']" }
              - id: chat_reopen_console
                ui: { action: click, target: ".domain-choices .is-chat" }
              - id: chat_doc_persists
                ui: { action: expect_visible, target: ".ask-view .chat-msg.is-doc" }
              - id: chat_token_still_there   # 消失探针：切走再回来，回答不得丢
                ui: { action: text_contains, value: "{token_probe}" }

diagnosis:
  logs: []                           # 生产环境无本地日志；失败时用 results.json 响应快照定位
